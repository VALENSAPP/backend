<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valens · Reputation Earned. Value Built</title>
  <meta name="description" content="Reputation Earned. Value Built" />

  <!-- Open Graph / WhatsApp / iMessage / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Valens" />
  <meta property="og:title" content="Valens App" />
  <meta property="og:description" content="Reputation Earned. Value Built" />
  <meta property="og:image" content="/share-assets/valens-share-og.png" />
  <meta property="og:image:secure_url" content="/share-assets/valens-share-og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Valens App" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Valens App" />
  <meta name="twitter:description" content="Reputation Earned. Value Built" />
  <meta name="twitter:image" content="/share-assets/valens-share-og.png" />

  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="apple-touch-icon-precomposed" href="/logo.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0d0618;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .redirect-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.4));
      animation: pulse 1.6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      100% { transform: scale(1.04); opacity: 1; }
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.2px;
    }
    .fallback-link {
      margin-top: 18px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .fallback-link a {
      color: #a78bfa;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-box">
    <img src="/logo.png" alt="Valens" class="logo" />
    <div class="spinner"></div>
    <div class="status-text" id="status-text">Opening Valens...</div>
    <p class="fallback-link" id="fallback-container">
      Taking longer than expected? <a id="fallback-link" href="#">Click here</a>
    </p>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const customPath = urlParams.get('path') || '';
      const path = customPath ? customPath.replace(/^\//, '') : 'home';

      const APP_STORE_URL = 'https://apps.apple.com/us/app/valens-app/id6752780902';
      const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.valens';
      const WEB_URL = 'https://www.valenscorp.com';
      const PACKAGE_ID = 'com.valens';

      const ua = (navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase();
      const isCrawler = /whatsapp|facebookexternalhit|twitterbot|telegrambot|applebot|discordbot|slackbot|linkedinbot/i.test(ua);
      if (isCrawler) {
        return;
      }

      const isIOS = /ipad|iphone|ipod/.test(ua) && !window.MSStream;
      const isAndroid = /android/i.test(ua);

      const statusText = document.getElementById('status-text');
      const fallbackContainer = document.getElementById('fallback-container');
      const fallbackLink = document.getElementById('fallback-link');

      let appOpened = false;
      function markOpened() { appOpened = true; }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden || document.webkitHidden) markOpened();
      });
      window.addEventListener('pagehide', markOpened);
      window.addEventListener('blur', markOpened);

      setTimeout(function () {
        if (!appOpened && fallbackContainer) {
          fallbackContainer.style.opacity = '1';
        }
      }, 2500);

      if (isAndroid) {
        if (statusText) statusText.textContent = 'Redirecting...';
        if (fallbackLink) fallbackLink.href = PLAY_STORE_URL;

        const fallbackUrl = encodeURIComponent(PLAY_STORE_URL);
        const androidIntent = `intent://${path}#Intent;scheme=com.valens;package=${PACKAGE_ID};S.browser_fallback_url=${fallbackUrl};end`;

        const startTime = Date.now();
        window.location.href = androidIntent;

        setTimeout(function () {
          const elapsed = Date.now() - startTime;
          if (!appOpened && elapsed < 2500) {
            window.location.href = PLAY_STORE_URL;
          }
        }, 1200);

      } else if (isIOS) {
        if (statusText) statusText.textContent = 'Redirecting...';
        if (fallbackLink) fallbackLink.href = APP_STORE_URL;

        const startTime = Date.now();
        window.location.href = `com.valens.app://${path}`;

        setTimeout(function () {
          const elapsed = Date.now() - startTime;
          if (!appOpened && elapsed < 2500) {
            window.location.href = APP_STORE_URL;
          }
        }, 1200);

      } else {
        if (statusText) statusText.textContent = 'Redirecting to Valens...';
        if (fallbackLink) fallbackLink.href = WEB_URL;
        window.location.replace(WEB_URL);
      }
    })();
  </script>
</body>
</html>
